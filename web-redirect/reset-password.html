<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Assignment Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="card">
    <div class="logo">🔐</div>
    <h1>Reset Your Password</h1>
    <p class="subtitle" id="subtitle">Opening Assignment Planner to complete your password reset…</p>

    <button class="btn" id="open-btn" style="display:none">Open Assignment Planner</button>

    <p class="status" id="status"></p>
  </div>

  <script>
    (function () {
      var SCHEME = "assignmentplanner://reset-password";

      // Implicit flow: Supabase puts tokens in the URL fragment.
      // #access_token=...&refresh_token=...&type=recovery
      var fragment = window.location.hash; // includes the leading "#"

      // PKCE flow: Supabase sends ?code=... in the query string instead.
      // App.js already handles code= on reset-password deep links via
      // exchangeCodeForSession, so we just need to forward the query string.
      var search = window.location.search;
      var hasPkceCode = search && search.indexOf("code=") !== -1;

      if ((!fragment || fragment === "#") && !hasPkceCode) {
        document.getElementById("subtitle").textContent =
          "This link appears to be invalid or has already been used.";
        document.getElementById("status").textContent =
          "If you need to reset your password, please request a new link in the app.";
        document.getElementById("status").className = "status error";
        return;
      }

      // Build the deep link: forward whichever token format Supabase used.
      var deepLink = hasPkceCode
        ? SCHEME + search          // PKCE:     assignmentplanner://reset-password?code=...
        : SCHEME + fragment;       // Implicit: assignmentplanner://reset-password#access_token=...

      // Attempt the redirect immediately
      window.location.href = deepLink;

      // Show the manual-open button after a short delay in case the app isn't
      // installed or the OS doesn't handle the scheme automatically.
      setTimeout(function () {
        var btn = document.getElementById("open-btn");
        var status = document.getElementById("status");
        btn.style.display = "inline-block";
        btn.href = deepLink;
        btn.onclick = function () { window.location.href = deepLink; };
        status.textContent =
          "If the app did not open automatically, tap the button above. " +
          "Make sure Assignment Planner is installed on this device.";
      }, 1500);
    })();
  </script>
</body>
</html>
