name: Deploy web redirects

# Publish the web-redirect/ folder to GitHub Pages so the Supabase auth
# email links (reset-password, confirm-email) resolve to a real URL.
#
# Live URLs after deployment:
#   https://edunlevy.github.io/assignment-planner/reset-password.html
#   https://edunlevy.github.io/assignment-planner/confirm-email.html
#
# FIRST-TIME SETUP (one-time manual step):
#   1. Push this file to main.
#   2. Go to GitHub → edunlevy/assignment-planner → Settings → Pages.
#   3. Under "Build and deployment" set Source to "GitHub Actions".
#   4. The next push to main (or re-run of this workflow) will deploy the pages.
#
# Also add the redirect URLs to Supabase (see NOTES.md "Auth redirect URLs").

on:
  push:
    branches: [main]
    paths:
      - 'web-redirect/**'
      - '.github/workflows/deploy-web-redirect.yml'
  workflow_dispatch:   # allow manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload web-redirect folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-redirect   # serves reset-password.html, confirm-email.html, styles.css

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
