name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-export:
    name: Expo web export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist
        env:
          # The web export reads these at bundle time. Empty values are
          # fine for verifying the bundle compiles — Supabase calls fail
          # at runtime, not build time.
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder
